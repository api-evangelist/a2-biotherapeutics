summary: >-
  A2 Biotherapeutics is a clinical-stage biotechnology company and does not run an API programme.
  There is no developer portal, no published versioning policy, no deprecation policy, no SLA and no
  status page. What follows records the observable lifecycle posture of the one live API surface —
  the WordPress REST API on the corporate site — and the negative results are as much the finding as
  the positive ones.
