x-enrichment-notes: >-
  Deliberately absent, each a verified negative on 2026-08-02: Idempotency (no idempotency contract
  exists on this surface), SDKs/Packages (nothing first-party on npm, PyPI or any registry),
  StatusPage (status.a2bio.com NXDOMAIN), Deprecation (no policy, no RFC 8594 headers), Security and
  SecurityTxt (/.well-known/security.txt 404, no disclosure page, no bug bounty), TrustCenter
  (trust.a2bio.com NXDOMAIN, no security certifications published), AgentCard
  (/.well-known/agent-card.json and /.well-known/agent.json both 404), AsyncAPI and Webhooks (no
  event surface), GitHubOrganization (github.com/A2Bio exists but carries no attribution to this
  company, so it is not claimed), Postman, Pricing, SignUp, Roadmap, Documentation, DeveloperPortal,
  APIReference, GettingStarted, Support, CLI, Sandbox and Components. The Compliance pointer is the
  company's published pharmaceutical regulatory compliance declaration, not a security attestation.
