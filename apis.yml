aid: a2-biotherapeutics
name: A2 Biotherapeutics
description: >-
  A2 Biotherapeutics (A2 Bio) is a clinical-stage biotechnology company headquartered in Agoura Hills,
  California, founded in 2018 by Alexander Kamb, Michael Gallo and Paul Kang. It develops logic-gated
  cell therapies for solid tumors on its proprietary Tmod platform, a two-receptor activator/blocker
  design that lets an engineered T cell attack tumor cells which have lost an HLA allele while sparing
  normal cells that retain it. A2 Bio operates no developer API programme and publishes no product,
  clinical or research API. It is catalogued here because its corporate website runs a live WordPress
  REST API with 298 discoverable routes, and because that same install exposes two Model Context
  Protocol servers guarded by an OAuth 2.1 authorization server the host advertises through RFC 8414
  and RFC 9728 metadata.
