apis:
- name: A2 Biotherapeutics WordPress REST API
  description: >-
    The live WordPress REST API served by the A2 Biotherapeutics corporate website. Route discovery is
    anonymous and advertises 298 routes across 16 namespaces; published content under wp/v2 (posts,
    pages, media, taxonomies) is readable without credentials, while writes, the WordPress Abilities
    registry and the MCP namespace are gated. This is the content-management API of the marketing
    site, not a therapeutic or research API. The OpenAPI in this repo is derived by API Evangelist
    from the provider's own live route-discovery document; A2 Bio publishes no OpenAPI itself.
  humanURL: https://www.a2bio.com/wp-json/
