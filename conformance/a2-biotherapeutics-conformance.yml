summary: >-
  Cross-cutting standards posture of the A2 Biotherapeutics corporate web/API surface. Note the split:
  the technical standards below are inherited from WordPress and Cloudflare rather than authored by
  A2 Bio, while the regulatory compliance programme at the bottom is a genuine, published,
  company-authored commitment.
standards:
  - id: oauth2
    conforms: true
    evidence: >-
      OAuth 2.1 authorization server advertised at /.well-known/oauth-authorization-server (HTTP 200)
      with authorization_code + refresh_token grants and response_types_supported ["code"].
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: true
    evidence: 'https://www.a2bio.com/.well-known/oauth-authorization-server returned 200 application/json'
  - id: rfc9728-oauth-protected-resource-metadata
    conforms: true
    evidence: >-
      https://www.a2bio.com/.well-known/oauth-protected-resource returned 200 naming
      https://www.a2bio.com/wp-json/mcp/mcp-oauth-server; the 401 from that resource carries a
      matching WWW-Authenticate Bearer challenge with resource_metadata.
  - id: rfc7636-pkce
    conforms: true
    evidence: 'code_challenge_methods_supported: ["S256"]'
  - id: oauth-client-id-metadata-document
    conforms: true
    evidence: 'client_id_metadata_document_supported: true (no dynamic client registration endpoint advertised)'
  - id: mcp-model-context-protocol
    conforms: true
    evidence: >-
      Two live MCP servers under the `mcp` REST namespace; both answer JSON-RPC over HTTP and both
      returned an authenticated-only 401 to tools/list.
    caveat: >-
      Protocol version could not be confirmed — initialize/tools-list are auth-gated, so conformance
      is asserted from the endpoint contract and OAuth metadata, not from a handshake.
