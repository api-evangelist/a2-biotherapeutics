  mcp:
    endpoints:
      - https://www.a2bio.com/wp-json/mcp/mcp-oauth-server
      - https://www.a2bio.com/wp-json/mcp/mcp-adapter-default-server
    gated: true
    note: >-
      Both return HTTP 401 to an anonymous tools/list. The OAuth server requires the `mcp` scope via
      authorization_code + PKCE. Tool input schemas require authenticated introspection.
