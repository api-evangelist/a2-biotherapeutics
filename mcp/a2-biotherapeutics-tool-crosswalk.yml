    source: https://www.a2bio.com/wp-json/
    gated: false
    note: >-
      Route discovery is anonymous (HTTP 200). Read operations on public content (wp/v2 posts, pages,
      media, taxonomies) are anonymous; write operations and privileged reads are capability-gated.
  graphql:
    endpoint: null
